spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/copilot
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 1 day in milliseconds

minio:
  url: http://localhost:9000
  access-key: admin
  secret-key: admin123456
  bucket: copilot-documents

server:
  port: 8080
  
ai:
  base-url: http://localhost:8000
  service:
    token: ${AI_SERVICE_TOKEN}
  
logging:
  level:
    org.springframework.security: TRACE